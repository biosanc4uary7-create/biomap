<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="manifest" href="manifest.json">
<title>BioMap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
@import url('https://fonts.cdnfonts.com/css/chalet');
@font-face { font-family: 'Pricedown'; src: url('https://fonts.cdnfonts.com/s/16045/pricedown bl.woff') format('woff'); }
body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #82A36B; font-family: 'Chalet', sans-serif; }
#map { height: 100vh; width: 100vw; background: #82A36B; } 
#gps-blocker { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 12, 0.98); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; text-transform: uppercase; }
.pulse-ring { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #55aaff; margin-bottom: 20px; animation: pulse 1.5s infinite ease-in-out; }
@keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(85, 170, 255, 0.7); } 70% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 0 15px rgba(85, 170, 255, 0); } 100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(85, 170, 255, 0); } }
#start-gps-btn { background: #2a5a2a; color: #55ff55; border: 2px solid #55ff55; padding: 15px 30px; font-family: 'Pricedown', sans-serif; font-size: 24px; cursor: pointer; text-shadow: 2px 2px 0 #000; box-shadow: 0 0 15px rgba(85, 255, 85, 0.4); border-radius: 8px; margin-top: 15px; }
#start-gps-btn:active { background: #55ff55; color: #000; text-shadow: none; }
#f3-panel { position: absolute; top: 0; left: 0; z-index: 10; background: rgba(15, 15, 15, 0.95); color: #ddd; padding: 8px; font-size: 13px; line-height: 1.4; pointer-events: none; text-shadow: 1px 1px 0 #000; border-bottom-right-radius: 4px; border-right: 2px solid #555; border-bottom: 2px solid #555; box-shadow: 3px 3px 0 rgba(0,0,0,0.5); max-width: 95vw; text-transform: uppercase; }
.highlight { color: #55ff55; }
.controls { display: flex; gap: 4px; margin-top: 6px; pointer-events: auto; flex-wrap: wrap; }
.btn { background: rgba(60, 60, 60, 0.9); color: #fff; border: 1px solid #444; padding: 6px; font-family: 'Chalet', sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; flex-grow: 1; text-shadow: 1px 1px 0 #000; text-transform: uppercase; }
.btn:active { background: #55ff55; color: #000; text-shadow: none; }
.btn-locked { background: #5555ff !important; border-color: #7777ff !important; }
.btn-danger { background: #ff4444 !important; border-color: #aa2222 !important; }
.btn-success { background: #2a5a2a !important; border-color: #44aa44 !important; }
.btn-warning { background: #884400 !important; border-color: #ff8800 !important; }
#progress-wrapper { display: none; width: 100%; height: 8px; background: #333; margin-top: 6px; border: 1px solid #555; border-radius: 4px; overflow: hidden; }
#progress-bar { width: 0%; height: 100%; background: #ffaa00; transition: width 0.3s; }
#speedometer { position: absolute; top: 350px; left: 10px; z-index: 20; font-size: 38px; color: #fff; -webkit-text-stroke: 1px #000; pointer-events: none; font-weight: bold; display: flex; align-items: baseline; gap: 5px; text-shadow: 2px 2px 0 #000; }
.speed-unit { font-size: 16px; -webkit-text-stroke: 0.5px #000; font-weight: bold; }
#route-bottom-info { display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 15, 0.9); border: 2px solid #55aaff; border-radius: 6px; padding: 8px 25px; z-index: 10; text-align: center; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,0,0,0.8); min-width: 180px; }
.dialog-box { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.95); border: 2px solid #55aaff; padding: 15px; z-index: 100; color: white; font-size: 14px; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.8); text-transform: uppercase; width: 250px; }
.dialog-box .btn { margin-top: 8px; width: 100%; padding: 8px; font-size: 13px; }
#crosshair { position: absolute; top: 50%; left: 50%; z-index: 20; width: 20px; height: 20px; margin-left: -10px; margin-top: -10px; pointer-events: none; opacity: 0.8; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; box-shadow: 0 0 3px black; }
#crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
#crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
.maplibregl-popup { z-index: 9999 !important; }
.maplibregl-popup-content { background: rgba(20, 20, 20, 0.95); border: 2px solid #55ff55; color: white; font-size: 13px; padding: 8px; border-radius: 0; text-transform: uppercase; min-width: 200px; }
.maplibregl-popup-tip { border-top-color: #55ff55 !important; }
.debug-input { background: #222; color: #fff; border: 1px solid #55ff55; padding: 4px; font-size: 12px; outline: none; width: 100%; box-sizing: border-box; margin-top: 4px; font-family: 'Chalet'; }
</style>
</head>
<body>
<div id="gps-blocker">
    <div class="pulse-ring"></div>
    <div style="font-size: 26px; color: #55ff55; text-shadow: 0 0 10px #55aaff;">РАДАР BIOMAP</div>
    <div id="gps-error-text" style="font-size: 12px; margin-top: 15px; color: #aaa; padding: 0 20px;">НАЖМИТЕ КНОПКУ НИЖЕ ДЛЯ ЗАПУСКА ДВИЖКА<br>И СКАНИРОВАНИЯ СПУТНИКОВ GPS.</div>
    <button id="start-gps-btn">ВКЛЮЧИТЬ GPS</button>
</div>
<div id="f3-panel">
    <div style="color:#aa55ff; font-weight:bold; font-size:16px;">BIOMAP V3</div>
    <div id="block-coords">XYZ: 0.000 / 64.000 / 0.000</div>
    <div id="gps-status" style="font-size:11px; margin-top:4px; color:#aaa;">GPS: ОЖИДАНИЕ...</div>
    <div id="explore-stats" style="font-size:11px; margin-top:2px; color:#00ffaa;">ИССЛЕДОВАНО: 0.00%</div>
    <div id="op-status" style="font-size:11px; margin-top:4px; color:#55ff55; font-weight:bold;">ДВИЖОК ГОТОВ.</div>
    <div id="progress-wrapper"><div id="progress-bar"></div></div>
    
    <div class="controls" id="fog-controls" style="display: none;">
        <button class="btn btn-locked" id="fog-btn" style="flex-grow: 1;">ТУМАН: ВКЛ</button>
    </div>
    <div class="controls">
        <button class="btn btn-warning" id="clear-db-btn" style="flex-grow: 1;">🗑️ ОЧИСТИТЬ БД</button>
        <button class="btn btn-success" id="export-btn" style="flex-grow: 1; background: #2255ff !important; border-color: #55aaff !important;">ЭКСПОРТ (.JSON)</button>
    </div>
    <div class="controls">
        <button class="btn" id="lock-cam-btn" style="flex-grow: 1;">КАМЕРА: СВОБ</button>
        <button class="btn" id="center-gps-btn" style="flex-grow: 0; width: 40px; font-size: 16px;">⌖</button>
    </div>
    <div class="controls">
        <button class="btn" id="btn-3d">ВИД: 2D</button>
        <button class="btn" id="theme-btn">ТЕМА: GTA SA</button>
        <button class="btn" id="grid-btn">СЕТКА: ВКЛ</button>
    </div>
    <div class="controls">
        <button class="btn" id="debug-btn" style="background: #555;">ОТЛАДКА: ВЫКЛ</button>
    </div>
    <div class="controls" id="route-controls" style="display:none;">
        <button class="btn btn-danger" id="clear-route-btn">СБРОСИТЬ МАРШРУТ</button>
    </div>
</div>
<div id="speedometer">0<span class="speed-unit">КМ/Ч</span></div>
<div id="route-bottom-info">
    <div style="font-size: 11px; color: #aaa; margin-bottom: 2px;">ВЕСЬ МАРШРУТ: <span id="route-dist-bottom" style="color:#fff;">0</span> КМ</div>
    <div id="route-rem-bottom" style="font-size: 16px; color: #ffaa00; font-weight: bold;"></div>
</div>
<div id="route-dialog" class="dialog-box">
    <div style="margin-bottom: 10px; color: #55aaff;">СОЗДАНИЕ МАРШРУТА</div>
    <div id="route-dialog-text" style="font-size: 12px; margin-bottom: 10px; color: #aaa;"></div>
    <button class="btn" id="btn-route-gps">ОТ МОЕГО GPS</button>
    <button class="btn" id="btn-route-cancel" style="background: #444;">ОТМЕНА</button>
</div>
<div id="crosshair"></div>
<div id="map"></div>

<script>
const $ = id => document.getElementById(id);
const DB_NAME = 'BioMapDB_V3', DB_VERSION = 7, CHUNK_SNAP = 0.0025, ERASE_RADIUS = 150, CHERKASY_TOTAL_CHUNKS = 418000;
const OVERPASS_ENDPOINTS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://lz4.overpass-api.de/api/interpreter"];
let db, dbLoaded = false, cachedBuildingIds = new Set(), cachedBuildingFeatures = [], completedChunks = new Set(), customRoadWidths = {};
let fogPoints = [], fogCanvas, lastErasedPos = null, downloadQueue = [], totalQueueSteps = 0, isDownloading = false, isFogOn = true, isDebugMode = false, currentEndpointIdx = 0;
let zeroX = 0, zeroZ = 0, mapReady = false, isGTASA = true, isCamLocked = false, is3D = false, isGridOn = true, userLocation = null, targetRoutePoint = null, currentGpsPos = null, targetGpsPos = null, currentHeading = 0, targetHeading = 0, clickPopup = null, firstGpsFix = false;
const REF_LAT_RAD = 49.4444 * Math.PI / 180, LOCAL_COS = Math.cos(REF_LAT_RAD);

function updateExploreStats() { $('explore-stats').innerText = `ИССЛЕДОВАНО: ${((completedChunks.size / CHERKASY_TOTAL_CHUNKS) * 100).toFixed(3)}%`; }

function initDB() {
    return new Promise((res, rej) => {
        let req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
            let d = e.target.result;
            ['buildings', 'chunks', 'fog', 'settings', 'custom_widths'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
        };
        req.onsuccess = e => { db = e.target.result; res(); }; req.onerror = e => rej(e.target.error);
    });
}

function eraseFogCircle(lng, lat) {
    if (lastErasedPos && getHaversineDistance(lat, lng, lastErasedPos[1], lastErasedPos[0]) * 1000 < 40) return;
    lastErasedPos = [lng, lat]; fogPoints.push({ lng, lat });
    let tx = db.transaction(['fog'], 'readwrite');
    tx.objectStore('fog').put({ id: `${lng.toFixed(5)}_${lat.toFixed(5)}`, lng: lng, lat: lat });
    if (mapReady) renderFog();
}

function loadFromDB() {
    return new Promise(res => {
        let tx = db.transaction(['buildings', 'chunks', 'fog', 'settings', 'custom_widths'], 'readonly');
        tx.objectStore('custom_widths').getAll().onsuccess = e => e.target.result.forEach(r => customRoadWidths[r.id] = r.width);
        tx.objectStore('buildings').getAll().onsuccess = e => e.target.result.forEach(r => { cachedBuildingIds.add(r.id); cachedBuildingFeatures.push(r.feature); });
        tx.objectStore('chunks').getAll().onsuccess = e => e.target.result.forEach(r => completedChunks.add(r.id));
        tx.objectStore('fog').getAll().onsuccess = e => { e.target.result.forEach(r => fogPoints.push({ lng: r.lng, lat: r.lat })); if (mapReady) renderFog(); };
        tx.objectStore('settings').get('zero_coord').onsuccess = e => { if (e.target.result) { zeroX = e.target.result.x; zeroZ = e.target.result.z; updateCoordsFast(); } };
        tx.oncomplete = () => { updateExploreStats(); res(); };
    });
}

function saveToDB(newBuildings, chunksToSave) {
    let tx = db.transaction(['buildings', 'chunks'], 'readwrite');
    let bStore = tx.objectStore('buildings'), cStore = tx.objectStore('chunks');
    newBuildings.forEach(i => bStore.put(i));
    chunksToSave.forEach(id => { cStore.put({ id: id }); completedChunks.add(id); });
    tx.oncomplete = () => updateExploreStats();
}

function saveZeroCoordsToDB(x, z) { zeroX = x; zeroZ = z; db.transaction(['settings'], 'readwrite').objectStore('settings').put({ id: 'zero_coord', x: x, z: z }).onsuccess = updateCoordsFast; }

function clearDB() {
    if(!confirm("ВНИМАНИЕ! Вы уверены, что хотите полностью стереть всю карту и туман войны? Это действие необратимо!")) return;
    if (db) db.close();
    indexedDB.deleteDatabase(DB_NAME).onsuccess = () => location.reload();
}

const map = new maplibregl.Map({
    container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [32.0597, 49.4444], zoom: 14, pitch: 0, bearing: 0, pitchWithRotate: true, dragPitch: true, dragRotate: true, maxBounds: [[28.5, 47.5], [34.0, 51.0]], minZoom: 5
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

function getMeters(lng, lat) { const r = 6378137; return { x: r * (lng * Math.PI / 180) * LOCAL_COS, z: -(r * (lat * Math.PI / 180)) }; }
function getLatLng(x, z) { const r = 6378137; return [ (x / LOCAL_COS) * 180 / (r * Math.PI), -(z * 180) / (r * Math.PI) ]; }
function getHaversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getRoadInfo(tags) {
    if (tags.width) { let w = parseFloat(tags.width.replace(',', '.')); if (!isNaN(w) && w > 0) return { width: w, isReal: true }; }
    if (tags['width:carriageway']) { let w = parseFloat(tags['width:carriageway'].replace(',', '.')); if (!isNaN(w) && w > 0) return { width: w, isReal: true }; }
    if (tags.lanes) { let lanes = parseFloat(tags.lanes); if (!isNaN(lanes) && lanes > 0) return { width: lanes * 3.5, isReal: false }; }
    let w = 5; if (tags.railway) w = 4; else if (tags.barrier) w = 1; else {
        switch(tags.highway) { case 'motorway': w = 15; break; case 'trunk': w = 12; break; case 'primary': w = 10; break; case 'secondary': case 'tertiary': w = 8; break; case 'residential': case 'unclassified': w = 6; break; case 'service': case 'pedestrian': w = 4; break; case 'track': w = 3; break; case 'footway': case 'path': case 'cycleway': w = 2; break; }
    }
    return { width: w, isReal: false };
}

function bufferLine(coords, width) {
    let hw = width / 2, pts = [getMeters(coords[0][0], coords[0][1])];
    for (let i = 1; i < coords.length; i++) { let m = getMeters(coords[i][0], coords[i][1]); if (Math.hypot(m.x - pts[pts.length - 1].x, m.z - pts[pts.length - 1].z) > 0.01) pts.push(m); }
    if (pts.length < 2) { let p = pts[0]; return [getLatLng(p.x - hw, p.z - hw), getLatLng(p.x + hw, p.z - hw), getLatLng(p.x + hw, p.z + hw), getLatLng(p.x - hw, p.z + hw), getLatLng(p.x - hw, p.z - hw)]; }
    let left = [], right = [];
    for (let i = 0; i < pts.length; i++) {
        let p = pts[i], pP = i > 0 ? pts[i - 1] : null, pN = i < pts.length - 1 ? pts[i + 1] : null, nx = 0, nz = 0;
        if (!pP) { let dx = pN.x - p.x, dz = pN.z - p.z, l = Math.hypot(dx, dz); nx = -dz / l; nz = dx / l; }
        else if (!pN) { let dx = p.x - pP.x, dz = p.z - pP.z, l = Math.hypot(dx, dz); nx = -dz / l; nz = dx / l; }
        else {
            let dx1 = p.x - pP.x, dz1 = p.z - pP.z, l1 = Math.hypot(dx1, dz1), n1x = -dz1 / l1, n1z = dx1 / l1;
            let dx2 = pN.x - p.x, dz2 = pN.z - p.z, l2 = Math.hypot(dx2, dz2), n2x = -dz2 / l2, n2z = dx2 / l2;
            nx = n1x + n2x; nz = n1z + n2z; let nl = Math.hypot(nx, nz);
            if (nl < 0.001) { nx = n1x; nz = n1z; } else { nx /= nl; nz /= nl; let dot = n1x * nx + n1z * nz; if (dot > 0.1) { nx /= dot; nz /= dot; } else { nx = n1x; nz = n1z; } }
        }
        left.push([p.x + nx * hw, p.z + nz * hw]); right.unshift([p.x - nx * hw, p.z - nz * hw]);
    }
    let pPts = left.concat(right); pPts.push(left[0]); return pPts.map(p => getLatLng(p[0], p[1]));
}

function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
function lerpAngle(a, b, t) { let d = b - a; while (d < -180) d += 360; while (d > 180) d -= 360; return a + d * t; }
function animateGps() {
    if (targetGpsPos && mapReady) {
        if (!currentGpsPos) { currentGpsPos = [...targetGpsPos]; currentHeading = targetHeading; }
        else { currentGpsPos[0] = lerp(currentGpsPos[0], targetGpsPos[0], 0.1); currentGpsPos[1] = lerp(currentGpsPos[1], targetGpsPos[1], 0.1); currentHeading = lerpAngle(currentHeading, targetHeading, 0.1); }
        if (map.getSource('gps-source')) map.getSource('gps-source').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: currentGpsPos }, properties: { heading: currentHeading } });
        if (isCamLocked) map.setCenter(currentGpsPos);
    }
    requestAnimationFrame(animateGps);
}
requestAnimationFrame(animateGps);

function updateCoordsFast() {
    if (!mapReady) return;
    const m = getMeters(map.getCenter().lng, map.getCenter().lat), yVal = $('y-val') ? $('y-val').innerText : "64.000";
    $('block-coords').innerHTML = `<span class="highlight">XYZ:</span> ${(m.x - zeroX).toFixed(3)} / <span id="y-val">${yVal}</span> / ${(m.z - zeroZ).toFixed(3)}`;
}

async function fetchElevation() {
    if (!mapReady) return;
    try { const c = map.getCenter(), res = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${c.lat}&longitude=${c.lng}`); if (res.ok) { const d = await res.json(); if(d.elevation && d.elevation[0]) $('y-val').innerText = (64 + Math.round(d.elevation[0] - 110)) + ".000"; } } catch (e) {}
}

async function buildCherkasyVoid() {
    try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?state=Cherkasy%20Oblast&country=Ukraine&polygon_geojson=1&format=json'), data = await res.json();
        if (data && data.length > 0 && data[0].geojson) {
            const geo = data[0].geojson; let mask = [[[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]]];
            if (geo.type === 'Polygon') mask.push(...geo.coordinates.map(r => [...r].reverse())); else if (geo.type === 'MultiPolygon') geo.coordinates.forEach(p => mask.push([...p[0]].reverse()));
            if (mapReady && map.getSource('void-mask')) { map.getSource('void-mask').setData({ type: "Feature", geometry: { type: "Polygon", coordinates: mask } }); map.getSource('cherkasy-border').setData(geo); }
        }
    } catch(e) {}
}

function applyTheme() {
    if (!mapReady || !map.getStyle() || !map.getStyle().layers) return;
    const skip = ['void-layer', 'border-layer', 'gps-layer', 'highlight-layer', 'chunk-grid', 'block-grid', 'route-layer', 'offline-buildings-layer', 'offline-roads-layer', 'offline-water-layer', 'offline-grass-layer', 'offline-sand-layer', 'offline-buildings-3d-layer'];
    map.getStyle().layers.forEach(l => {
        if (skip.includes(l.id.toLowerCase())) return;
        if (l.type === 'line' || l.type === 'fill' || l.type === 'fill-extrusion') { try { map.setLayerZoomRange(l.id, 1, 24); } catch(e) {} }
        if (l.type === 'symbol') {
            if (l.id.toLowerCase().includes('place') && ['city', 'town', 'village', 'hamlet'].some(p => l.id.toLowerCase().includes(p))) {
                map.setLayoutProperty(l.id, 'visibility', 'visible'); map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name_en'], ['get', 'name:en'], ['get', 'name']]);
                if (map.getPaintProperty(l.id, 'text-color')) map.setPaintProperty(l.id, 'text-color', isGTASA ? '#ffffff' : '#dddddd');
            } else map.setLayoutProperty(l.id, 'visibility', 'none');
        }
    });
    map.getStyle().layers.forEach(l => {
        let id = l.id.toLowerCase();
        if (skip.includes(id)) return;
        if (id.includes('water') && l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', isGTASA ? '#5A94A7' : '#2b3642');
        else if ((id.includes('park') || id.includes('landcover') || id.includes('wood') || id.includes('grass')) && l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', isGTASA ? '#6A8B58' : '#141518');
        else if (id.includes('sand') && l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', isGTASA ? '#D1BE8E' : '#4a402d');
        else if (id.includes('building') && l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', isGTASA ? '#E4E4E4' : '#292929');
        else if (l.type === 'line' && (id.includes('road') || id.includes('path') || id.includes('street') || id.includes('highway'))) map.setPaintProperty(l.id, 'line-color', isGTASA ? '#000000' : '#ffffff');
    });
    try {
        if(map.getLayer('background')) map.setPaintProperty('background', 'background-color', isGTASA ? '#82A36B' : '#141518');
        if(map.getLayer('void-layer')) map.setPaintProperty('void-layer', 'fill-color', isGTASA ? '#4a90e2' : '#2b3642');
        if(map.getLayer('border-layer')) map.setPaintProperty('border-layer', 'line-color', isGTASA ? '#55ff55' : '#888888');
        if(map.getLayer('chunk-grid')) map.setPaintProperty('chunk-grid', 'line-color', isGTASA ? '#000000' : '#55ff55');

function updateVisibility(lng, lat) {

    const cX = Math.floor(lng / CHUNK_SNAP), cY = Math.floor(lat / CHUNK_SNAP); let newQ = false;
    for (let dx = -1; dx <= 1; dx++) {

            if (!completedChunks.has(cId) && !downloadQueue.some(c => c.id === cId)) { downloadQueue.push({ id: cId, minLng: sLng, minLat: sLat, maxLng: sLng + CHUNK_SNAP, maxLat: sLat + CHUNK_SNAP }); newQ = true; }
        }

                if (fT !== 'unknown') {

                    if (['building','water','sand','grass'].includes(fT)) { if (coords.length < 3) return; if (coords[0][0] !== coords[coords.length - 1][0] || coords[0][1] !== coords[coords.length - 1][1]) coords.push(coords[0]); isP = true; fC = [coords]; } 
                    else if (fT === 'road') {
                        if (coords.length < 2) return;

                        else { rI = getRoadInfo(el.tags); if (customRoadWidths[el.id]) { rI.width = customRoadWidths[el.id]; rI.isReal = true; } fC = [bufferLine(coords, rI.width)]; isP = true; }
                    }

                    if (fT === 'road') {
                        if (el.tags.highway) props.highway = el.tags.highway; if (el.tags.railway) props.is_railway = true; if (el.tags.highway && ['track', 'dirt', 'path', 'unclassified'].includes(el.tags.highway)) props.is_dirt = true;
                        if (el.tags.width) props.width = el.tags.width; if (el.tags['width:carriageway']) props['width:carriageway'] = el.tags['width:carriageway']; if (el.tags.lanes) props.lanes = el.tags.lanes; if (el.tags.surface) props.surface = el.tags.surface;

                }

        if (newB.length > 0) { $('op-status').style.color = '#55ff55'; $('op-status').innerText = `+${newB.length} ОБЪЕКТОВ`; }
        if (map.getSource('custom-buildings')) map.getSource('custom-buildings').setData({ type: 'FeatureCollection', features: cachedBuildingFeatures });
        setTimeout(processDownloadQueue, 4000); 
    } catch(err) {
        b.reverse().forEach(c => downloadQueue.unshift(c)); $('op-status').style.color = '#ff4444';
        if (err.message === "429") { $('op-status').innerText = `ЛИМИТ (БАН). ЖДЕМ 10 СЕК...`; currentEndpointIdx = (currentEndpointIdx + 1) % OVERPASS_ENDPOINTS.length; setTimeout(processDownloadQueue, 10000); } 
        else { $('op-status').innerText = `ОШИБКА. СМЕНА ЗЕРКАЛА...`; currentEndpointIdx = (currentEndpointIdx + 1) % OVERPASS_ENDPOINTS.length; setTimeout(processDownloadQueue, 8000); }
    }
}

    $('btn-make-route').onclick = () => { targetRoutePoint = [e.lngLat.lng, e.lngLat.lat]; clickPopup.remove(); $('route-dialog-text').innerText = `ЦЕЛЬ: X: ${Math.floor(m.x - zeroX)} | Z: ${Math.floor(m.z - zeroZ)}`; $('route-dialog').style.display = 'block'; };
    $('btn-set-zero').onclick = () => { saveZeroCoordsToDB(bX, bZ); clickPopup.remove(); };
    if (isDebugMode && cOsmId && $('btn-save-d')) {
        $('btn-save-d').onclick = () => {
            let idx = cachedBuildingFeatures.findIndex(f => f.properties && f.properties.osmid == cOsmId);
            if (idx !== -1) {
                let f = cachedBuildingFeatures[idx]; f.properties.type = $('d-type').value;
                if ($('d-rail').checked) f.properties.is_railway = true; else delete f.properties.is_railway;
                if ($('d-dirt').checked) f.properties.is_dirt = true; else delete f.properties.is_dirt;
                let tx = db.transaction(['buildings', 'custom_widths'], 'readwrite');
                if ($('d-width') && f.properties.centerline) {
                    let nw = parseFloat($('d-width').value); if (!isNaN(nw) && nw > 0) { customRoadWidths[cOsmId] = nw; tx.objectStore('custom_widths').put({ id: cOsmId, width: nw }); f.geometry.coordinates = [bufferLine(JSON.parse(f.properties.centerline), nw)]; f.properties.computed_width = nw; f.properties.is_custom = true; }
                }
                tx.objectStore('buildings').put({ id: cOsmId, feature: f });
                tx.oncomplete = () => { map.getSource('custom-buildings').setData({ type: 'FeatureCollection', features: cachedBuildingFeatures }); clickPopup.remove(); };
            }
        };
    }
});

$('btn-route-gps').onclick = () => { $('route-dialog').style.display = 'none'; if (userLocation) fetchRoute(userLocation, targetRoutePoint); };
$('btn-route-cancel').onclick = () => $('route-dialog').style.display = 'none';
map.on('move', () => { updateCoordsFast(); updateGrid(); });
$('lock-cam-btn').addEventListener('click', (e) => { isCamLocked = !isCamLocked; e.target.innerText = isCamLocked ? "КАМЕРА: СЛЕДИТЬ" : "КАМЕРА: СВОБ"; e.target.classList.toggle('btn-locked', isCamLocked); });
$('center-gps-btn').addEventListener('click', () => { if(userLocation) map.flyTo({ center: userLocation, zoom: 16 }); });
$('btn-3d').addEventListener('click', (e) => { is3D = !is3D; e.target.innerText = is3D ? "ВИД: 3D" : "ВИД: 2D"; e.target.classList.toggle('btn-locked', is3D); map.setLayoutProperty('offline-buildings-layer', 'visibility', is3D ? 'none' : 'visible'); map.setLayoutProperty('offline-buildings-3d-layer', 'visibility', is3D ? 'visible' : 'none'); map.easeTo({ pitch: is3D ? 60 : 0 }); });
$('grid-btn').addEventListener('click', (e) => { isGridOn = !isGridOn; e.target.innerText = isGridOn ? "СЕТКА: ВКЛ" : "СЕТКА: ВЫКЛ"; e.target.classList.toggle('btn-locked', !isGridOn); if(map.getLayer('chunk-grid')) map.setLayoutProperty('chunk-grid', 'visibility', isGridOn ? 'visible' : 'none'); if(map.getLayer('block-grid')) map.setLayoutProperty('block-grid', 'visibility', isGridOn ? 'visible' : 'none'); if(isGridOn) updateGrid(); else if(map.getSource('grid-source')) map.getSource('grid-source').setData({ type: 'FeatureCollection', features: [] }); });
$('theme-btn').addEventListener('click', (e) => { isGTASA = !isGTASA; e.target.innerText = isGTASA ? "ТЕМА: GTA SA" : "ТЕМА: GTA 5"; applyTheme(); });
$('clear-route-btn').addEventListener('click', () => { if(map.getSource('route-source')) map.getSource('route-source').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }); $('route-bottom-info').style.display = 'none'; $('route-controls').style.display = 'none'; targetRoutePoint = null; });
$('export-btn').addEventListener('click', () => { if (cachedBuildingFeatures.length === 0) return; const b = $('export-btn'); b.innerText = "СОЗДАНИЕ..."; setTimeout(() => { try { const u = URL.createObjectURL(new Blob([JSON.stringify({ type: "FeatureCollection", features: cachedBuildingFeatures })], { type: "application/json" })); const a = document.createElement('a'); a.href = u; a.download = "BioMap_World.geojson"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); } catch (e) {} finally { b.innerText = "ЭКСПОРТ (.JSON)"; } }, 100); });
</script>
</body>
</html>
